<style>
@import url('https://fonts.googleapis.com/css2?family=Italiana&family=Outfit:wght@300;400;600&family=Caveat:wght@400;500&family=Pinyon+Script&display=swap');

html, body { margin: 0; padding: 0; background: #000; }
body { font-family: 'Outfit', sans-serif; color: #fff; -webkit-text-size-adjust: 100%; }
body.locked { height: 100vh; height: 100dvh; overflow: hidden; }
html body.locked { min-height: 0 !important; }

#gate {
  position: fixed; inset: 0; z-index: 99999;
  display: flex; align-items: center; justify-content: center;
  background: #000;
  transition: opacity 1.4s cubic-bezier(0.25, 1, 0.5, 1), visibility 0s linear 1.4s;
  overflow: hidden;
}
#gate.done { opacity: 0; visibility: hidden; pointer-events: none; }

/* slow breathing violet, a hint of the world behind the door */
#gate::before, #gate::after {
  content: ''; position: absolute; inset: -30%;
  background:
    radial-gradient(40% 35% at 30% 40%, rgba(112, 52, 190, 0.34), transparent 70%),
    radial-gradient(36% 32% at 72% 62%, rgba(78, 28, 150, 0.30), transparent 70%);
  animation: breathe 14s ease-in-out infinite alternate;
  pointer-events: none;
}
#gate::after {
  background: radial-gradient(30% 26% at 55% 28%, rgba(190, 150, 255, 0.16), transparent 70%);
  animation-duration: 19s; animation-direction: alternate-reverse;
}
@keyframes breathe {
  from { transform: translate3d(-3%, -2%, 0) scale(1); }
  to   { transform: translate3d(3%, 3%, 0) scale(1.12); }
}

.gate-inner {
  position: relative; z-index: 1;
  width: min(360px, calc(100vw - 56px));
  display: flex; flex-direction: column; align-items: center; text-align: center;
}
.gate-brand {
  font-family: 'Italiana', serif; font-weight: 400;
  font-size: clamp(44px, 12vw, 64px); letter-spacing: 6px; line-height: 1;
  color: #fff6ed; margin: 0 0 14px 6px;
}
.gate-brand img { display: block; width: min(260px, 62vw); height: auto; margin: 0 auto; filter: drop-shadow(0 0 28px rgba(160, 100, 255, 0.35)); }
.gate-line { font-size: 14px; font-weight: 300; letter-spacing: 0.5px; color: #d1d5db; margin: 0 0 40px; }

#gate-form { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 22px; }
#gate-input {
  width: 100%; box-sizing: border-box;
  background: transparent; border: 0; border-bottom: 1px solid rgba(255, 255, 255, 0.35);
  color: #fff6ed; text-align: center;
  font-family: 'Outfit', sans-serif; font-weight: 300; font-size: 20px; letter-spacing: 4px;
  padding: 10px 0 12px; border-radius: 0; outline: none;
  -webkit-user-select: text; user-select: text;
  transition: border-color 0.3s;
}
#gate-input::placeholder { color: rgba(255, 255, 255, 0.35); letter-spacing: 2px; font-size: 14px; }
#gate-input:focus { border-bottom-color: rgba(206, 170, 255, 0.9); }
#gate-form.shake #gate-input { animation: shake 0.45s; }
@keyframes shake { 20%, 60% { transform: translateX(-7px); } 40%, 80% { transform: translateX(7px); } }

#gate-btn {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 11px 30px; border: 0; cursor: pointer;
  background: #ffffff; color: #000000;
  font-family: 'Outfit', sans-serif; font-size: 10px; text-transform: uppercase; letter-spacing: 1px; font-weight: 600;
  border-radius: 20px; transition: transform 0.3s, background 0.3s, opacity 0.3s;
}
#gate-btn:hover { transform: scale(1.05); background: #f0f0f0; }
#gate-btn:disabled { opacity: 0.55; cursor: default; transform: none; }
#gate-btn .dot { display: inline-block; width: 6px; height: 6px; border: 1px solid #000; border-radius: 50%; }

#gate-msg { min-height: 20px; margin: 22px 0 0; font-size: 13px; font-weight: 300; color: #d1d5db; letter-spacing: 0.4px; }
#gate-msg.err { color: #f0b4ff; }
#gate-hint { margin: 10px 0 0; font-size: 13px; font-weight: 300; color: rgba(209, 213, 219, 0.7); }
#gate-hint:empty { display: none; }
.gate-sound {
  position: absolute; left: 0; right: 0; bottom: 34px; z-index: 1; margin: 0; text-align: center;
  font-size: 11px; font-weight: 300; letter-spacing: 3px; text-transform: uppercase; color: rgba(209, 213, 219, 0.55);
}
.gate-sound:empty { display: none; }

#gate-bar { position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: rgba(255, 255, 255, 0.08); opacity: 0; transition: opacity 0.4s; }
#gate-bar i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, #7a3fd1, #cfb0ff); transform-origin: 0 50%; transform: scaleX(0.03); transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1); }
#gate.busy #gate-bar { opacity: 1; }

#gate :focus-visible { outline: 1px solid #cfb0ff; outline-offset: 4px; }
#app-root { position: relative; }

<script>
(function () {
  'use strict';
  var META = { salt: 'Mx8OlDLYtgFrs2f1hKiRDQ==', iter: 250000 };
  var SILENT = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=';

  var gate = document.getElementById('gate');
  var form = document.getElementById('gate-form');
  var input = document.getElementById('gate-input');
  var btn = document.getElementById('gate-btn');
  var btnLabel = document.getElementById('gate-btn-label');
  var msg = document.getElementById('gate-msg');
  var barFill = document.querySelector('#gate-bar i');

  function b64(s) { var bin = atob(s), a = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i); return a; }
  // Same normalisation as build.py: case, spaces and . - / _ & are ignored, so typing a date with or without separators works.
  function norm(s) { return s.trim().toLowerCase().replace(/[\s.\-\/_&]/g, ''); }

  async function derive(pw) {
    var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: b64(META.salt), iterations: META.iter, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']

  }
  function dec(key, buf) {
    var u = new Uint8Array(buf);
    return crypto.subtle.decrypt({ name: 'AES-GCM', iv: u.slice(0, 12) }, key, u.slice(12));
  }
  function say(text, isErr) { msg.textContent = text || ''; msg.className = isErr ? 'err' : ''; }
  function busy(on) { gate.classList.toggle('busy', on); btn.disabled = on; input.disabled = on; btnLabel.textContent = on ? 'Opening' : 'Enter'; }

  window.__gateProgress = function (p) { barFill.style.transform = 'scaleX(' + Math.max(0.03, Math.min(1, p)) + ')'; };
  window.__gateDone = function () {
    gate.classList.add('done');
    document.body.classList.remove('locked');
    window.scrollTo(0, 0);
    setTimeout(function () { gate.remove(); }, 1600);
  };
  window.__gateFail = function (text) {
    busy(false); document.body.classList.add('locked'); say(text, true);
  };

  if (!window.isSecureContext || !window.crypto || !crypto.subtle) {
    say('This page needs a secure (https) connection to open.', true);
    btn.disabled = true;
  }

  // A link like  …/#password  pre-fills the field, so a QR code can carry it. She still taps Enter.
  if (location.hash.length > 1) {
    try { input.value = decodeURIComponent(location.hash.slice(1)); history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
  }

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    var pw = norm(input.value);
    if (!pw) { input.focus(); return; }

    // Unlock audio inside this tap, so the song can start once everything is decrypted.
    if (!window.__audio) { try { var a = new Audio(SILENT); a.play().catch(function () {}); window.__audio = a; } catch (err) {} }

    busy(true); say(''); window.__gateProgress(0.05);
    var key, bundle, manifest;
    try {
      key = await derive(pw);
      window.__gateProgress(0.15);
      var res;
      try { res = await fetch('app.bin', { cache: 'no-cache' }); if (!res.ok) throw new Error(res.status); }
      catch (netErr) { busy(false); say('Could not load the page. Check your connection and try again.', true); return; }
      var buf = await res.arrayBuffer();
      var plain;
      try { plain = await dec(key, buf); }
      catch (badKey) {
        busy(false); say('That is not it. Try again.', true);
        form.classList.remove('shake'); void form.offsetWidth; form.classList.add('shake');
        input.value = ''; input.focus(); return;
      }
      bundle = JSON.parse(new TextDecoder().decode(plain));
      manifest = bundle.manifest;
      window.__gateProgress(0.3);
    } catch (err) { busy(false); say('Something went wrong. Refresh and try again.', true); return; }

    var cache = new Map();
    window.__config = bundle.config;
    window.__vault = {
      audio: window.__audio || new Audio(),
      has: function (n) { return Object.prototype.hasOwnProperty.call(manifest, n); },
      url: function (n) {
        if (cache.has(n)) return cache.get(n);
        var p = (async function () {
          var m = manifest[n];
          var r = await fetch(m.file);
          if (!r.ok) throw new Error('missing ' + n);
          var plain = await dec(key, await r.arrayBuffer());
          return URL.createObjectURL(new Blob([plain], { type: m.mime }));
        })();
        cache.set(n, p);
        return p;
      }
    };

    var style = document.createElement('style');
    style.textContent = bundle.css;
    document.head.appendChild(style);
    document.getElementById('app-root').innerHTML = bundle.html;
    document.body.classList.add('app-on');
    var s = document.createElement('script');
    s.type = 'module';
    s.textContent = bundle.js;
    document.body.appendChild(s);
    // If the page script never starts (very old browser), say so instead of waiting forever.
    setTimeout(function () { if (!window.__appStarted) window.__gateFail('This browser could not open the page. Try the latest Chrome or Safari.'); }, 12000);
  });
})();
</script>
